<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COLREG Rules Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a0e1a;
    --deep: #0d1b2e;
    --ocean: #0f3460;
    --teal: #00b4d8;
    --cyan: #90e0ef;
    --gold: #f4a93d;
    --white: #e8f4f8;
    --correct: #00c896;
    --wrong: #ff4d6d;
    --glass: rgba(15, 52, 96, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated ocean background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(0,180,216,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(15,52,96,0.4) 0%, transparent 60%),
      linear-gradient(180deg, #0a0e1a 0%, #0d1b2e 50%, #0a0e1a 100%);
    z-index: -2;
  }

  /* Wave lines */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 60px,
      rgba(0,180,216,0.03) 60px,
      rgba(0,180,216,0.03) 61px
    );
    z-index: -1;
    animation: drift 20s linear infinite;
  }

  @keyframes drift {
    from { transform: translateY(0); }
    to { transform: translateY(61px); }
  }

  /* ── Header ── */
  header {
    text-align: center;
    padding: 3rem 1rem 2rem;
    position: relative;
  }

  .anchor-icon {
    font-size: 3rem;
    margin-bottom: 0.5rem;
    display: block;
    animation: bob 3s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  header h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.4rem, 4vw, 2.6rem);
    font-weight: 900;
    letter-spacing: 0.1em;
    background: linear-gradient(135deg, var(--teal), var(--cyan), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    margin-top: 0.5rem;
    color: rgba(144,224,239,0.6);
    font-size: 1rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* ── Progress bar ── */
  .progress-wrap {
    max-width: 700px;
    margin: 0 auto 2rem;
    padding: 0 1.5rem;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: var(--cyan);
    margin-bottom: 0.4rem;
  }

  .progress-bar {
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--ocean), var(--teal), var(--gold));
    border-radius: 3px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  /* ── Quiz card ── */
  .card {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }

  .question-card {
    background: var(--glass);
    border: 1px solid rgba(0,180,216,0.2);
    border-radius: 16px;
    padding: 2rem;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    animation: slideIn 0.4s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-number {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 0.8rem;
  }

  .q-text {
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.55;
    color: var(--white);
    margin-bottom: 1.8rem;
  }

  /* ── Options ── */
  .options {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding: 0.9rem 1.2rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(0,180,216,0.15);
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 400;
    color: rgba(232,244,248,0.85);
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .option-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(0,180,216,0.06));
    opacity: 0;
    transition: opacity 0.2s;
  }

  .option-btn:hover:not(:disabled)::before { opacity: 1; }
  .option-btn:hover:not(:disabled) {
    border-color: rgba(0,180,216,0.45);
    color: var(--white);
    transform: translateX(4px);
  }

  .opt-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--teal);
    min-width: 22px;
    margin-top: 1px;
    flex-shrink: 0;
  }

  .option-btn.correct {
    background: rgba(0,200,150,0.15);
    border-color: var(--correct);
    color: var(--white);
    transform: none;
  }

  .option-btn.wrong {
    background: rgba(255,77,109,0.12);
    border-color: var(--wrong);
    color: rgba(232,244,248,0.6);
  }

  .option-btn:disabled { cursor: default; }

  .result-icon {
    margin-left: auto;
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  /* ── Feedback ── */
  .feedback {
    margin-top: 1.2rem;
    padding: 0.8rem 1rem;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    display: none;
    animation: pop 0.3s ease;
  }

  @keyframes pop {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .feedback.correct {
    background: rgba(0,200,150,0.12);
    border: 1px solid rgba(0,200,150,0.3);
    color: var(--correct);
    display: block;
  }

  .feedback.wrong {
    background: rgba(255,77,109,0.1);
    border: 1px solid rgba(255,77,109,0.25);
    color: var(--wrong);
    display: block;
  }

  /* ── Next button ── */
  .next-btn {
    margin-top: 1.5rem;
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, var(--ocean), var(--teal));
    border: none;
    border-radius: 10px;
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--white);
    cursor: pointer;
    transition: all 0.2s ease;
    display: none;
  }

  .next-btn:hover {
    background: linear-gradient(135deg, var(--teal), var(--cyan));
    color: var(--navy);
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(0,180,216,0.3);
  }

  /* ── Results screen ── */
  #results {
    display: none;
    max-width: 700px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
    text-align: center;
    animation: slideIn 0.5s ease;
  }

  .score-ring {
    width: 160px;
    height: 160px;
    margin: 0 auto 1.5rem;
    position: relative;
  }

  .score-ring svg {
    transform: rotate(-90deg);
    width: 160px;
    height: 160px;
  }

  .score-ring circle {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
  }

  .ring-bg { stroke: rgba(255,255,255,0.07); }
  .ring-fg { stroke: url(#grad); transition: stroke-dashoffset 1s ease; }

  .score-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .score-num {
    font-family: 'Orbitron', monospace;
    font-size: 2.4rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--teal), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .score-label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: var(--cyan);
    opacity: 0.7;
    text-transform: uppercase;
  }

  #results h2 {
    font-family: 'Orbitron', monospace;
    font-size: 1.6rem;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, var(--teal), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .result-msg {
    color: rgba(144,224,239,0.7);
    font-size: 1.1rem;
    margin-bottom: 2rem;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .stat-box {
    background: var(--glass);
    border: 1px solid rgba(0,180,216,0.15);
    border-radius: 12px;
    padding: 1.2rem;
    backdrop-filter: blur(8px);
  }

  .stat-val {
    font-family: 'Orbitron', monospace;
    font-size: 2rem;
    font-weight: 700;
  }

  .stat-val.green { color: var(--correct); }
  .stat-val.red { color: var(--wrong); }

  .stat-lbl {
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    color: rgba(144,224,239,0.5);
    text-transform: uppercase;
    margin-top: 0.2rem;
  }

  .restart-btn {
    padding: 1rem 3rem;
    background: linear-gradient(135deg, var(--ocean), var(--teal));
    border: none;
    border-radius: 10px;
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--white);
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .restart-btn:hover {
    background: linear-gradient(135deg, var(--teal), var(--gold));
    color: var(--navy);
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0,180,216,0.35);
  }

  /* ── Credit ── */
  .credit {
    text-align: center;
    padding: 1.5rem 0 2rem;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    color: rgba(0,180,216,0.35);
    text-transform: uppercase;
  }

  .credit span { color: var(--gold); }
</style>
</head>
<body>

<header>
  <span class="anchor-icon">⚓</span>
  <h1>COLREG Rules — 1983</h1>
  <p>Navigation & Collision Regulations Quiz</p>
</header>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-info">
    <span id="progressText">Question 1 of 50</span>
    <span id="scoreText">Score: 0</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:2%"></div>
  </div>
</div>

<div class="card" id="quizArea">
  <div class="question-card" id="questionCard">
    <div class="q-number" id="qNumber">QUESTION 01</div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="optionsArea"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">NEXT QUESTION ›</button>
  </div>
</div>

<div id="results">
  <div class="score-ring">
    <svg viewBox="0 0 160 160">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00b4d8"/>
          <stop offset="100%" stop-color="#f4a93d"/>
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="80" cy="80" r="68"/>
      <circle class="ring-fg" id="ringFg" cx="80" cy="80" r="68"
        stroke-dasharray="427" stroke-dashoffset="427"/>
    </svg>
    <div class="score-text">
      <div class="score-num" id="finalPct">0%</div>
      <div class="score-label">Score</div>
    </div>
  </div>

  <h2 id="resultTitle">Quiz Complete!</h2>
  <p class="result-msg" id="resultMsg"></p>

  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-val green" id="correctCount">0</div>
      <div class="stat-lbl">✓ Correct</div>
    </div>
    <div class="stat-box">
      <div class="stat-val red" id="wrongCount">0</div>
      <div class="stat-lbl">✗ Wrong</div>
    </div>
  </div>

  <button class="restart-btn" onclick="restartQuiz()">⟳ RESTART QUIZ</button>
</div>

<div class="credit">Made by <span>Ahmad Krdaghli</span></div>

<script>
const questions = [
  { q: "What vessels do COLREG rules 1983 apply to?", options: ["All vessels navigating in international water.", "All vessels navigating in roadstead, straits and open seas.", "All vessels upon the high seas and in all waters connected therewith."], correct: 2 },
  { q: "Which statement is TRUE according to the Rules?", options: ["A vessel engaged in fishing while underway shall so far as possible keep out of the way of a vessel restricted in her ability to maneuver.", "A vessel not under command shall keep out of the way of a vessel restricted in her ability to maneuver.", "A vessel engaged in fishing shall keep out of the way of a sailing vessel."], correct: 0 },
  { q: "Which vessel is to keep out of the way of the others?", options: ["A vessel constrained by her draft.", "A vessel engaged in underwater operations.", "A vessel engaged in trawling."], correct: 2 },
  { q: "What vessel may be considered as 'vessel restricted in her ability to manoeuvre'?", options: ["Vessel engaged in replenishment or transferring persons or cargo while under way.", "Vessel lying to, on stormy weather.", "Vessel with damages to steering gear."], correct: 0 },
  { q: "What distance between vessels shall the avoiding action ensure?", options: ["A distance of not less than 6 cables shall be insured.", "It shall be such as to result in passing at safe distance.", "It shall be such as to ensure that the vessel passes at more than 2 miles distance."], correct: 1 },
  { q: "How shall an action to avoid collision be taken?", options: ["In ample time, with a succession of small alterations of course in order not to deviate from the vessel's course.", "In ample time, with alterations of course or speed to be large enough and observing with other vessel.", "Positively, with speed alterations only."], correct: 1 },
  { q: "When shall a stand-on vessel take action to avoid collision by her maneuver alone?", options: ["When the vessels are navigating through the strait.", "When entering or leaving a traffic separation scheme.", "When from any cause, the vessel finds herself so close that collision cannot be avoided by the action of the give way vessel alone."], correct: 2 },
  { q: "Which vessel is NOT regarded as being 'restricted in her ability to maneuver'?", options: ["A vessel servicing an aid to navigation.", "A vessel engaged in dredging.", "A vessel damaged to engine."], correct: 2 },
  { q: "How shall a vessel overtaking any other conduct?", options: ["The vessel overtaking any other will have priority.", "The overtaken vessel shall manoeuvre such as to allow the overtaking vessel to overtake.", "Any vessel overtaking any other shall keep out of the way of the vessel being overtaken."], correct: 2 },
  { q: "How shall a power-driven vessel navigate in conditions of restricted visibility?", options: ["At a safe speed and her engines ready for her immediate maneuvers.", "At slow speed but the telegraph on 'stand by' in order to be able to maneuver in ample time.", "At economic speed, but with a proper look out."], correct: 0 },
  { q: "Till when shall the effectiveness of an avoiding action be checked?", options: ["Until the vessels shall be abeam one to each other.", "Until the other vessel will be at an angle of more than 22.5 degrees by starboard/portside.", "Until the other vessel is finally past and clear."], correct: 2 },
  { q: "Sailing boat approaching your sailing boat — both have wind from different sides. Your boat has wind from port side. Who gives way?", options: ["The other sail boat should give way to your sail boat.", "It depends on which direction the other sail boat is coming from.", "You should give way to the other sail boat."], correct: 2 },
  { q: "How shall a vessel manoeuvre in doubt as to whether she is overtaking another?", options: ["She shall consider herself a privileged vessel and shall maintain her course and speed.", "She shall assume that this is the case and act accordingly.", "She shall give the regular signals and after being enlightened, act according to the circumstances."], correct: 1 },
  { q: "Which answer best describes what you are required to do (keeping a lookout)?", options: ["It's the officer's job to keep a good lookout using 'all available means'.", "It's the crew's job to keep a good lookout using 'all available means'.", "It's the officer's job to keep a good look out using his/her eyes."], correct: 0 },
  { q: "When shall it be deemed that a risk of collision exists?", options: ["When the vessels are navigating on opposite courses.", "When the compass bearing of an approaching vessel does not appreciably change.", "When the approaching speed between the two vessels is very high."], correct: 1 },
  { q: "How shall a vessel navigate within a traffic separation scheme?", options: ["The vessel shall navigate as close as possible to the traffic separation schemes.", "The vessel shall navigate in the traffic lane in the indicated direction.", "The vessel shall navigate in the appropriate traffic lane in general direction of traffic flow for that lane and so far as practicable keep clear of a traffic separation line or separation zone."], correct: 2 },
  { q: "What does the word 'seaplane' mean?", options: ["Any aircraft designed to carry out hydro technical and/or hydro meteorological work.", "Any aircraft designed to maneuver on the water.", "Any aircraft being on the water for various reasons."], correct: 1 },
  { q: "When shall a vessel be deemed to be overtaking any other?", options: ["When coming up with another vessel from a direction more than 22.5 degrees aft her beam so that at night she would be able to see only the stern light of that vessel.", "When she will be able to see the stern light and sidelights of the overtaken vessel.", "When she will be able to see the stern-masthead light and sidelights."], correct: 0 },
  { q: "What does IRPCS stand for?", options: ["International Rules for the prevention of collision at sea.", "International Rules for preventing collision at sea.", "International Regulations for the prevention of collision at sea.", "International Regulations for preventing collision at sea."], correct: 2 },
  { q: "Which vessels are exempted from complying with the rule regarding navigation in traffic separation schemes?", options: ["Vessels restricted in their ability to maneuver when engaged in an operation for the maintenance of safety of navigation in the traffic scheme.", "Vessels with damages to the main engine.", "Vessel with damages to the steering gear."], correct: 0 },
  { q: "What does the word 'vessel' mean according to the COLREG rules?", options: ["Any watercraft capable of floating on water without propelling machinery.", "Any watercraft including non-displacement craft and seaplanes used or capable of being used as a means of transportation on water.", "Any floating object fitted with propelling machinery."], correct: 1 },
  { q: "What vessel may be considered as a vessel restricted in her ability to maneuver? (Q22)", options: ["A vessel engaged in replenishment or transferring persons, provisions or cargo while underway.", "A vessel lying to, in stormy weather.", "A vessel with damages to the steering gear."], correct: 0 },
  { q: "How shall vessels engaged in fishing conduct in a traffic separation scheme?", options: ["They shall conduct as any other vessel and shall comply with the COLREG rules.", "They shall navigate in any direction for fishing purposes.", "They shall not impede the passage of any vessel following a traffic lane."], correct: 2 },
  { q: "How shall vessels not using a traffic separation scheme navigate?", options: ["They shall use the inshore traffic zones.", "They shall avoid it by as wide a margin as practicable.", "They shall navigate in the proximity of, but shall not cross the separation line."], correct: 1 },
  { q: "Which is the best maneuver to allow more time to assess the situation when a collision must be avoided?", options: ["Slackening her speed or taking all way off by stopping or reversing her means of propulsion.", "Slacking the speed to steering way.", "Stopping the vessel."], correct: 0 },
  { q: "Which are the factors taken into account in determining the safe speed?", options: ["The vessel's length and the engine's power.", "The crew's training, the navigation condition and visibility.", "The traffic density, the background lights, the state of wind and sea, the vessel's draught."], correct: 2 },
  { q: "Sailing vessels A and B — wind from same side. What is the correct action?", options: ["Both vessels should alter course.", "Vessel A only should alter course.", "Vessel B only should alter course."], correct: 2 },
  { q: "Sailing vessels A and B — wind from different sides. What is the correct action?", options: ["Both vessels should alter course.", "Vessel A should alter course.", "Vessel B should alter course."], correct: 1 },
  { q: "Is anchoring permitted in a narrow channel?", options: ["No.", "It should be avoided if at all possible.", "Yes, but only near the outer limit of the fairway to starboard."], correct: 1 },
  { q: "Which statement is TRUE according to the Rules? (Q30)", options: ["A vessel engaged in fishing while underway shall so far as possible keep out of the way of a vessel restricted in her ability to maneuver.", "A vessel not under command shall keep out of the way of a vessel restricted in her ability to maneuver.", "A vessel engaged in fishing shall keep out of the way of a sailing vessel."], correct: 0 },
  { q: "Which vessel is to keep out of the way of the others? (Q31)", options: ["A vessel constrained by her draft.", "A vessel engaged in underwater operations.", "A vessel engaged in trawling."], correct: 2 },
  { q: "Which statement applies to a vessel 'constrained by her draft'?", options: ["She is severely restricted in her ability to change her course because of her draft in relation to the available depth of water.", "The term applies only to vessels in marked channels.", "She is designated as a 'vessel restricted in her maneuver'."], correct: 0 },
  { q: "Your vessel is proceeding in a narrow channel. What side should you sail on?", options: ["The Starboard (Right) side.", "The Port Side (Left).", "Nobody is on the narrow channel now so you can sail on any side you want."], correct: 0 },
  { q: "How shall an action to avoid collision be taken? (Q34)", options: ["In ample time, with a succession of small alterations of course.", "In ample time, with alterations of course or speed to be large enough and observing with the other vessel.", "Positively, with speed alterations only."], correct: 1 },
  { q: "What does the term 'restricted visibility' mean?", options: ["Any condition in which visibility is reduced under 1.5 nautical miles.", "The condition in which the visibility is restricted by fog, rain, or snow.", "Any condition in which the visibility is restricted by fog, mist, falling snow, heavy rainstorms, or any other similar cause."], correct: 2 },
  { q: "Which vessel is NOT regarded as being restricted in her ability to maneuver? (Q36)", options: ["A vessel servicing an aid to navigation.", "A vessel engaged in dredging.", "A vessel constrained by her draft."], correct: 2 },
  { q: "Which vessel shall avoid impeding the safe passage of a vessel constrained by her draft?", options: ["A vessel not under command.", "A sailing vessel.", "A vessel restricted in her ability to maneuver."], correct: 1 },
  { q: "How shall a power-driven vessel navigate in conditions of restricted visibility? (Q38)", options: ["At a safe speed and her engines ready for her immediate maneuvers.", "At slow speed but the telegraph on 'stand by'.", "At economic speed, but with a proper look out."], correct: 0 },
  { q: "What distance shall the avoiding action ensure? (Q39)", options: ["A distance of not less than 6 cables shall be ensured.", "It shall be such as to result in passing at safe distance.", "It shall be such as to ensure that the vessel passes at more than 2 n.m distance."], correct: 1 },
  { q: "Sailing boat approaching your sailing boat — both have wind from different sides. (Q40) Who gives way?", options: ["The other sail boat should give way to your sail boat.", "It depends on which direction the other sail boat is coming from.", "You should give way to the other sail boat."], correct: 2 },
  { q: "Which answer best describes who the collision regulations apply to?", options: ["All vessels.", "All vessels except sailing boats as 'power gives way to sail'.", "All vessels except sailing dinghies."], correct: 0 },
  { q: "Which answer best describes what you are required to do? (Q42)", options: ["It's the officer's job to keep a good lookout using 'all available means'.", "It's the crew's job to keep a good lookout using 'all available means'.", "It's the officer's job to keep a good look out using his/her eyes."], correct: 0 },
  { q: "When shall it be deemed that a risk of collision exists? (Q43)", options: ["When the vessels are navigating on opposite courses.", "When the compass bearing of an approaching vessel does not appreciably change.", "When the approaching speed between the two vessels is very high."], correct: 1 },
  { q: "How shall a vessel navigate within a traffic separation? (Q44)", options: ["The vessel shall navigate as close as possible to the traffic separation schemes.", "The vessel shall navigate in the traffic lane in the indicated direction.", "The vessel shall navigate in the appropriate traffic lane in general direction of traffic flow and keep clear of a separation line or zone."], correct: 2 },
  { q: "What does the word 'seaplane' mean? (Q45)", options: ["Any aircraft designed to carry out hydro technical work.", "Any aircraft designed to maneuver on the water.", "Any aircraft being on the water for various reasons."], correct: 1 },
  { q: "When shall a vessel be deemed to be overtaking any other? (Q46)", options: ["When coming up with another vessel from a direction more than 22.5 degrees aft her beam so that at night she would be able to see only the stern light of that vessel.", "When she will be able to see the stern light and sidelights of the overtaken vessel.", "When she will be able to see the stern-masthead light and sidelights."], correct: 0 },
  { q: "What does IRPCS stand for? (Q47)", options: ["International Rules for the prevention of collision at sea.", "International Rules for preventing collision at sea.", "International Regulations for the prevention of collision at sea.", "International Regulations for preventing collision at sea."], correct: 2 },
  { q: "Which vessels are exempted from complying with the rule regarding navigation in traffic separation schemes? (Q48)", options: ["Vessels restricted in their ability to maneuver when engaged in an operation for the maintenance of safety of navigation.", "Vessels with damages to the main engine.", "Vessel with damages to the steering gear."], correct: 0 },
  { q: "What does the word 'vessel' mean according to COLREG rules? (Q49)", options: ["Any watercraft capable of floating on water without propelling machinery.", "Any watercraft including non-displacement craft and seaplanes used or capable of being used as a means of transportation on water.", "Any floating object fitted with propelling machinery."], correct: 1 },
  { q: "What vessel may be considered as 'vessel restricted in her ability to maneuver'? (Q50)", options: ["A vessel engaged in replenishment or transferring persons, provisions or cargo while underway.", "A vessel lying to, in stormy weather.", "A vessel with damages to the steering gear."], correct: 0 }
];

// Shuffle questions
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let shuffled = [];
let current = 0;
let score = 0;
let answered = false;

const labels = ['A', 'B', 'C', 'D'];

function initQuiz() {
  shuffled = shuffle(questions);
  current = 0;
  score = 0;
  answered = false;
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = shuffled[current];
  const total = shuffled.length;

  // Progress
  document.getElementById('progressText').textContent = `Question ${current + 1} of ${total}`;
  document.getElementById('scoreText').textContent = `Score: ${score}`;
  document.getElementById('progressFill').style.width = `${((current) / total) * 100}%`;

  // Question
  document.getElementById('qNumber').textContent = `QUESTION ${String(current + 1).padStart(2, '0')}`;
  document.getElementById('qText').textContent = q.q;

  // Options
  const area = document.getElementById('optionsArea');
  area.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="opt-label">${labels[i]}</span><span>${opt}</span><span class="result-icon"></span>`;
    btn.onclick = () => selectAnswer(i, q.correct);
    area.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('nextBtn').style.display = 'none';

  // Re-animate card
  const card = document.getElementById('questionCard');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'slideIn 0.4s ease';
}

function selectAnswer(chosen, correct) {
  if (answered) return;
  answered = true;

  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback');

  if (chosen === correct) {
    btns[chosen].classList.add('correct');
    btns[chosen].querySelector('.result-icon').textContent = '✓';
    fb.className = 'feedback correct';
    fb.textContent = '✔ Correct! Well done.';
    score++;
  } else {
    btns[chosen].classList.add('wrong');
    btns[chosen].querySelector('.result-icon').textContent = '✗';
    btns[correct].classList.add('correct');
    btns[correct].querySelector('.result-icon').textContent = '✓';
    fb.className = 'feedback wrong';
    fb.textContent = `✘ Wrong. The correct answer is: ${labels[correct]}.`;
  }

  document.getElementById('scoreText').textContent = `Score: ${score}`;
  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('nextBtn').textContent =
    current + 1 < shuffled.length ? 'NEXT QUESTION ›' : 'SEE RESULTS ›';
}

function nextQuestion() {
  current++;
  if (current < shuffled.length) {
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  const r = document.getElementById('results');
  r.style.display = 'block';

  const total = shuffled.length;
  const pct = Math.round((score / total) * 100);

  document.getElementById('finalPct').textContent = pct + '%';
  document.getElementById('correctCount').textContent = score;
  document.getElementById('wrongCount').textContent = total - score;

  // Ring animation
  const circumference = 427;
  const offset = circumference - (pct / 100) * circumference;
  setTimeout(() => {
    document.getElementById('ringFg').style.strokeDashoffset = offset;
  }, 100);

  let title, msg;
  if (pct === 100) { title = '🏆 Perfect Score!'; msg = 'Outstanding! You know COLREG inside out.'; }
  else if (pct >= 80) { title = '⚓ Excellent!'; msg = 'Great knowledge of the collision regulations!'; }
  else if (pct >= 60) { title = '🚢 Good Job!'; msg = 'Solid understanding — review the missed questions.'; }
  else if (pct >= 40) { title = '📚 Keep Studying'; msg = 'You\'re getting there — more practice needed.'; }
  else { title = '⚠️ Needs Work'; msg = 'Review the COLREG rules and try again.'; }

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMsg').textContent = msg;
}

function restartQuiz() {
  initQuiz();
}

// Start
initQuiz();
</script>
